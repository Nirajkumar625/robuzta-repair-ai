<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robuzta Repair AI V55.2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dfe6ee;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #0f172a12}.head{background:linear-gradient(135deg,#081827,#1e4262);color:#fff;padding:27px 30px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:13px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:#ffffff18;display:grid;place-items:center;font-size:24px}h1{margin:0;font-size:25px}.sub{font-size:12px;color:#cbd5e1;margin-top:4px}.main{padding:25px 30px}.nav{display:flex;gap:8px;margin-bottom:15px}.btn{border:0;border-radius:11px;background:#64748b;color:#fff;font-weight:900;padding:12px 15px;cursor:pointer}.active{background:#2563eb!important}.searchbtn{width:100%;margin-top:10px;background:#2563eb;font-size:15px}.label{font-size:12px;font-weight:900}textarea{width:100%;margin-top:8px;padding:16px;border:2px solid #dfe6ee;border-radius:14px;font-size:17px;resize:vertical;outline:none}.box{margin-top:13px;padding:16px;background:#f8fafc;border:1px solid #dfe6ee;border-radius:15px}.title{font-size:13px;font-weight:900}.tag{display:inline-block;background:#e9efff;color:#244b9e;padding:6px 9px;border-radius:99px;margin-top:5px;font-size:11px}.price{font-size:36px;font-weight:950;margin-top:4px}.muted{font-size:11px;color:#667085}.row{padding:9px 0;border-bottom:1px solid #dfe6ee}.link{color:#2563eb;text-decoration:none;font-weight:800}.admin{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ar{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#fff;border:1px solid #e6ebf1;border-radius:9px}.ar input{width:115px;padding:8px;border:1px solid #ccd5df;border-radius:8px}.ok{padding:10px;border-radius:9px;background:#ecfdf3;color:#166534;font-size:11px;margin-top:9px}.err{padding:10px;border-radius:9px;background:#fff1f2;color:#9f1239;font-size:11px;margin-top:9px}@media(max-width:700px){.head{padding:21px}.main{padding:20px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card">
<div class="head"><div class="brand"><div class="logo">🤖</div><div><h1>ROBUZTA REPAIR AI</h1><div class="sub">V55.2 • Central Pricing Fixed</div></div></div><div id="status">● CONNECTING</div></div>
<div class="main"><div class="nav"><button class="btn active" id="searchTab">🔍 Search</button><button class="btn" id="adminTab">⚙️ Admin</button></div>
<section id="searchPage"><label class="label">ONE SEARCH — TYPE NATURALLY</label><textarea id="query" rows="3" placeholder="Dell hinge repair"></textarea><button class="btn searchbtn" id="searchBtn">🔍 SEARCH & GET ESTIMATE</button><div id="out"></div></section>
<section id="adminPage" class="admin"><div class="box"><div class="title">🔐 ADMIN LOGIN</div><input id="email" type="email" placeholder="Admin email" style="margin-top:8px;padding:11px;width:100%;border:1px solid #ccd5df;border-radius:9px"><input id="password" type="password" placeholder="Password" style="margin-top:8px;padding:11px;width:100%;border:1px solid #ccd5df;border-radius:9px"><button class="btn searchbtn" id="login">LOGIN</button><button class="btn searchbtn" id="logout" style="display:none;background:#64748b">LOGOUT</button><div id="loginMsg" class="muted" style="margin-top:8px"></div></div>
<div class="box" id="panel" style="display:none"><div class="title">⚙️ CENTRAL PRICING</div><div id="prices" class="grid"></div><button class="btn searchbtn" id="save">💾 SAVE TO CENTRAL DATABASE</button><div id="cloudMsg"></div></div></section>
</div></div></div>
<script>
const SUPABASE_URL="https://dmxwsmgdtcbrbppunhlk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_g9GYOtXXVfk8vhEN9GSTUg_RgGnzOV-";
const fallback={"hinge": 2600, "ac_body": 2800, "both_side": 3200, "hinge_ac_body": 3800, "copy_display": 3600, "original_display": 4800, "touch_display": 10000, "windows_10": 1000, "windows_11": 1000, "office": 500, "licensed_office": 2500, "autocad": 500, "fitting_min": 1500, "fitting_max": 5000, "motherboard_old": 2800, "motherboard_2020": 3800, "motherboard_latest": 6800, "gaming_motherboard": 6800};let sb=null,R={...fallback};
const names={hinge:"Hinge",ac_body:"A/C Body",both_side:"Both Side",hinge_ac_body:"Hinge + A/C Body",copy_display:"Copy Display",original_display:"Original Display",touch_display:"Touch Display",windows_10:"Windows 10",windows_11:"Windows 11",office:"MS Office",licensed_office:"Licensed MS Office",autocad:"AutoCAD",fitting_min:"Fitting Minimum",fitting_max:"Fitting Maximum",motherboard_old:"Motherboard Old",motherboard_2020:"Motherboard 2020",motherboard_latest:"Motherboard Latest",gaming_motherboard:"Gaming Motherboard"};
const money=n=>"₹"+Math.round(Number(n)||0).toLocaleString("en-IN");
function msg(t,good){cloudMsg.className=good?"ok":"err";cloudMsg.textContent=t}
async function connect(){if(!window.supabase||SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")){status.textContent="● KEY NEEDED";return}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let r=await sb.from("pricing").select("key,value");if(r.error){status.textContent="● DB ERROR";msg("Database read failed: "+r.error.message,false);return}R={};r.data.forEach(x=>R[x.key]=Number(x.value));status.textContent="● ONLINE"}
async function loadPrices(){prices.innerHTML="<div class='muted'>Loading central pricing…</div>";if(!sb){loadLocal();return}let r=await sb.from("pricing").select("key,value").order("key");if(r.error){loadLocal();msg("Could not load central pricing: "+r.error.message,false);return}R={};r.data.forEach(x=>R[x.key]=Number(x.value));prices.innerHTML="";Object.keys(names).forEach(k=>{if(R[k]!==undefined)prices.innerHTML+="<div class='ar'><span>"+names[k]+"</span><input id='p_"+k+"' type='number' value='"+R[k]+"'></div>"})}
function loadLocal(){prices.innerHTML="";Object.keys(names).forEach(k=>{if(R[k]!==undefined)prices.innerHTML+="<div class='ar'><span>"+names[k]+"</span><input id='p_"+k+"' type='number' value='"+R[k]+"'></div>"})}
function detect(n){let a=[["Hinge + A/C Body Both",/hinge.*(body|ac)|((body|ac).*hinge)/],["Both Side Hinge/Body",/both.*side.*(hinge|body)|(hinge|body).*both.*side/],["A/C Body Broken",/ac.*body|body.*broken/],["Hinge Repair",/hinge/],["Copy Display",/copy.*(display|screen)/],["Original Display",/original.*(display|screen)|oem.*display/],["Touch Display",/touch|digitizer/],["Windows 10 Installation",/windows.*10|win.*10/],["Windows 11 Installation",/windows.*11|win.*11/],["Licensed MS Office",/licensed.*office|genuine.*office/],["MS Office Installation",/office|ms.*office/],["AutoCAD Installation",/autocad|auto.*cad/],["Motherboard / Chip-Level",/motherboard|chip.*level|short.*circuit|no.*power|dead/],["RAM",/ram|ddr2|ddr3|ddr4|ddr5/],["NVMe",/nvme|m.*2/],["SATA SSD",/sata/],["SSD / Storage",/ssd|storage/],["Display",/display|screen|lcd|panel/],["Battery",/battery/],["Keyboard",/keyboard/],["Charging",/charging|dc.*jack/],["Fan / Cooling",/fan|overheat|heating/]];for(let x of a)if(x[1].test(n))return x[0];return"General Repair"}
function run(){let raw=query.value.trim();if(!raw){out.innerHTML="<div class='box'>Please type a repair problem.</div>";return}let n=raw.toLowerCase().replace(/[^a-z0-9]+/g," ").trim(),p=detect(n);let map={"Hinge Repair":"hinge","A/C Body Broken":"ac_body","Both Side Hinge/Body":"both_side","Hinge + A/C Body Both":"hinge_ac_body","Copy Display":"copy_display","Original Display":"original_display","Touch Display":"touch_display","Windows 10 Installation":"windows_10","Windows 11 Installation":"windows_11","Licensed MS Office":"licensed_office","MS Office Installation":"office","AutoCAD Installation":"autocad"},k=map[p],v=k&&R[k]!=null?R[k]:null,s=encodeURIComponent(n+" price India");out.innerHTML="<div class='box'><div class='title'>🤖 UNDERSTOOD</div><span class='tag'>"+p+"</span><div class='muted'>Query: <b>"+n+"</b></div></div><div class='box'><div class='title'>💰 REPAIR PRICE</div><div class='price'>"+(v!=null?money(v):"Manual verification")+"</div><div class='muted'>Source: "+(v!=null?"Central database":"Category reference")+"</div></div><div class='box'><div class='title'>🔧 FITTING</div><div class='price'>"+money(R.fitting_min||1500)+" – "+money(R.fitting_max||5000)+"</div></div><div class='box'><div class='title'>🌐 MARKET VERIFICATION</div><a class='link' target='_blank' href='https://www.google.com/search?q="+s+"'>Google ↗</a> &nbsp; <a class='link' target='_blank' href='https://www.bing.com/search?q="+s+"'>Bing ↗</a></div>"}
searchBtn.onclick=run;query.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();run()}});
searchTab.onclick=()=>{searchPage.style.display="block";adminPage.style.display="none";searchTab.classList.add("active");adminTab.classList.remove("active")};
adminTab.onclick=()=>{searchPage.style.display="none";adminPage.style.display="block";adminTab.classList.add("active");searchTab.classList.remove("active")};
login.onclick=async()=>{if(!sb){loginMsg.textContent="Publishable key is not configured.";return}let r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error){loginMsg.textContent=r.error.message;return}login.style.display="none";logout.style.display="block";panel.style.display="block";loginMsg.textContent="Admin logged in.";await loadPrices()};
logout.onclick=async()=>{if(sb)await sb.auth.signOut();panel.style.display="none";login.style.display="block";logout.style.display="none";loginMsg.textContent="Logged out."};
save.onclick=async()=>{if(!sb){msg("Supabase is not configured.",false);return}let rows=Object.keys(names).filter(k=>document.getElementById("p_"+k)).map(k=>({key:k,value:Number(document.getElementById("p_"+k).value)}));let r=await sb.from("pricing").upsert(rows,{onConflict:"key"});if(r.error)msg("Save failed: "+r.error.message,false);else{msg("Central pricing updated successfully.",true);await loadPrices()}};
connect();
</script></body></html>
